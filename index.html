<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sovereign Navigator — Remedy & Restoration Matrix</title>

  <!-- Typography -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep-obsidian: #0A0A0A;
      --bg-gate-slate: #1C1C1E;
      --accent-burnished-brass: #C8A86E;
      --accent-brass-subtle: rgba(200, 168, 110, 0.25);
      --text-alabaster: #F5F5F2;
      --text-muted: #8E8E93;
      --border-sovereign: 1px solid rgba(200, 168, 110, 0.28);
      --shadow-gate: 0 8px 32px rgba(0, 0, 0, 0.65), 0 0 20px rgba(200, 168, 110, 0.08);

      --font-ceremonial: 'Cinzel', Georgia, serif;
      --font-system: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    <body>
  <div class="page-container">
    <h1>Sovereign Navigator</h1>
    <h2>Remedy & Re‑Stabilization Matrix</h2>

    <!-- Gate 0: Status Gate -->
    <article class="gate-card">
      <div class="gate-institutional">
        <div class="gate-title">
          <svg class="crest" viewBox="0 0 24 24">
            <circle cx="12" cy="7" r="4" />
            <line x1="12" y1="11" x2="12" y2="21" />
            <line x1="8" y1="21" x2="16" y2="21" />
          </svg>
          Gate 0: Status Gate
        </div>

        <p class="field-label">Standing</p>
        <p class="field-value">Baseline jurisdiction established</p>

        <p class="field-label">Priority</p>
        <p class="field-value">Intake routing active</p>
      </div>

      <div class="gate-natural">
        <div>
          <span class="decree-badge">Initial Sovereign Standing</span>
          <p>Recognition of presence. The earth-plane acknowledges the traveler.</p>
        </div>
        <button class="btn-sovereign">Attest Standing</button>
      </div>
    </article>

    <!-- Gate I: Unsheltered Intake -->
    <article class="gate-card">
      <div class="gate-institutional">
        <div class="gate-title">
          <svg class="crest" viewBox="0 0 24 24">
            <polyline points="4,20 12,4 20,20" />
            <circle cx="12" cy="14" r="1.5" fill="#C8A86E" />
          </svg>
          Gate I: Unsheltered Intake
        </div>

        <p class="field-label">Vitals</p>
        <p class="field-value">Initial contact & stabilization</p>

        <p class="field-label">Local Hub</p>
        <p class="field-value">Meyer Center / My Brother’s Keeper</p>
      </div>

      <div class="gate-natural">
        <div>
          <span class="decree-badge">Arrival</span>
          <p>The traveler enters the field of care. Breath returns.</p>
        </div>
        <button class="btn-sovereign">Confirm Intake</button>
      </div>
    </article>

    <!-- Gate II: Identity Gate -->
    <article class="gate-card">
      <div class="gate-institutional">
        <div class="gate-title">
          <svg class="crest" viewBox="0 0 24 24">
            <path d="M12 2C12 2 7 9 7 14A5 5 0 0 0 17 14C17 9 12 2 12 2Z" />
            <path d="M12 11C12 11 10 13.5 10 15A2 2 0 0 0 14 15C14 13.5 12 11 12 11Z" />
          </svg>
          Gate II: Identity Gate
        </div>

        <p class="field-label">Verification</p>
        <p class="field-value">Identity stabilization</p>
      </div>

      <div class="gate-natural">
        <div>
          <span class="decree-badge">Essence</span>
          <p>The sovereign name is remembered.</p>
        </div>
        <button class="btn-sovereign">Verify Identity</button>
      </div>
    </article>

    <!-- Gate III: HMIS Enrollment -->
    <article class="gate-card">
      <div class="gate-institutional">
        <div class="gate-title">
          <svg class="crest" viewBox="0 0 24 24">
            <path d="M3 8C6 6 8 10 12 8C16 6 18 10 21 8" />
            <path d="M3 12C6 10 8 14 12 12C16 10 18 14 21 12" />
            <path d="M3 16C6 14 8 18 12 16C16 14 18 18 21 16" />
          </svg>
          Gate III: HMIS Enrollment
        </div>

        <p class="field-label">Registry</p>
        <p class="field-value">HMIS entry active</p>
      </div>

      <div class="gate-natural">
        <div>
          <span class="decree-badge">Record of Flow</span>
          <p>The traveler enters the river of record.</p>
        </div>
        <button class="btn-sovereign">Enroll</button>
      </div>
    </article>

    <!-- Gate IV: Benefits Hub -->
    <article class="gate-card">
      <div class="gate-institutional">
        <div class="gate-title">
          <svg class="crest" viewBox="0 0 24 24">
            <rect x="5" y="4" width="14" height="10" rx="1" />
            <line x1="12" y1="14" x2="12" y2="21" />
            <line x1="8" y1="21" x2="16" y2="21" />
            <line x1="9" y1="17" x2="6" y2="20" />
            <line x1="15" y1="17" x2="18" y2="20" />
          </svg>
          Gate IV: Benefits Hub
        </div>

        <p class="field-label">Provision</p>
        <p class="field-value">SNAP / SSI / Medicaid</p>
      </div>

      <div class="gate-natural">
        <div>
          <span class="decree-badge">Provision</span>
          <p>Roots deepen. Earth-plane stability begins.</p>
        </div>
        <button class="btn-sovereign">Verify Benefits</button>
      </div>
    </article>

    <!-- Gate V: Medical & Behavioral -->
    <article class="gate-card">
      <div class="gate-institutional">
        <div class="gate-title">
          <svg class="crest" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" />
            <line x1="12" y1="7" x2="12" y2="17" />
            <line x1="7" y1="12" x2="17" y2="12" />
          </svg>
          Gate V: Medical & Behavioral
        </div>

        <p class="field-label">Health</p>
        <p class="field-value">Physical & behavioral triage</p>
      </div>

      <div class="gate-natural">
        <div>
          <span class="decree-badge">Restoration</span>
          <p>The body and mind return to center.</p>
        </div>
        <button class="btn-sovereign">Confirm Clearance</button>
      </div>
    </article>

    <!-- Gate VI: Housing Pathway -->
    <article class="gate-card">
      <div class="gate-institutional">
        <div class="gate-title">
          <svg class="crest" viewBox="0 0 24 24">
            <line x1="4" y1="5" x2="20" y2="5" />
            <line x1="6" y1="5" x2="6" y2="19" />
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="18" y1="5" x2="18" y2="19" />
            <line x1="4" y1="19" x2="20" y2="19" />
          </svg>
          Gate VI: Housing Pathway
        </div>

        <p class="field-label">Shelter</p>
        <p class="field-value">Routing to stable housing</p>
      </div>

      <div class="gate-natural">
        <div>
          <span class="decree-badge">Shelter</span>
          <p>The traveler receives structure and covering.</p>
        </div>
        <button class="btn-sovereign">Confirm Placement</button>
      </div>
    </article>

    <!-- Gate VII: Economic Stabilization -->
    <article class="gate-card">
      <div class="gate-institutional">
        <div class="gate-title">
          <svg class="crest" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4" />
            <line x1="12" y1="3" x2="12" y2="6" />
            <line x1="12" y1="18" x2="12" y2="21" />
            <line x1="3" y1="12" x2="6" y2="12" />
            <line x1="18" y1="12" x2="21" y2="12" />
            <line x1="5.6" y1="5.6" x2="7.8" y2="7.8" />
            <line x1="16.2" y1="16.2" x2="18.4" y2="18.4" />
          </svg>
          Gate VII: Economic Stabilization
        </div>

        <p class="field-label">Work</p>
        <p class="field-value">Employment & financial recovery</p>
      </div>

      <div class="gate-natural">
        <div>
          <span class="decree-badge">Motion</span>
          <p>The traveler re-enters the field of economic sovereignty.</p>
        </div>
        <button class="btn-sovereign">Verify Employment</button>
      </div>
    </article>

    <!-- Gate VIII: Legal Stability -->
    <article class="gate-card">
      <div class="gate-institutional">
        <div class="gate-title">
          <svg class="crest" viewBox="0 0 24 24">
            <line x1="12" y1="3" x2="12" y2="18" stroke-width="2" />
            <line x1="8" y1="6" x2="16" y2="6" />
            <circle cx="12" cy="20" r="1.5" fill="#C8A86E" />
          </svg>
          Gate VIII: Legal Stability
        </div>

        <p class="field-label">Order</p>
        <p class="field-value">Documentation & legal support</p>
      </div>

      <div class="gate-natural">
        <div>
          <span class="decree-badge">Covenant</span>
          <p>The traveler’s legal standing is restored.</p>
        </div>
        <button class="btn-sovereign">Confirm Legal Clearance</button>
      </div>
    </article>

    <!-- Gate IX: Sovereign Restoration -->
    <article class="gate-card">
      <div class="gate-institutional">
        <div class="gate-title">
          <svg class="crest" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5" />
            <path d="M12 2V5M12 19V22M2 12H5M19 12H22M4.9 4.9L7.1 7.1M16.9 16.9L19.1 19.1M4.9 19.1L7.1 16.9M16.9 7.1L19.1 4.9" />
          </svg>
          Gate IX: Sovereign Restoration
        </div>

        <p class="field-label">Autonomy</p>
        <p class="field-value">Full reintegration & sovereign return</p>
      </div>

      <div class="gate-natural">
        <div>
          <span class="decree-badge">Radiance</span>
          <p>The traveler stands restored, whole, and sovereign.</p>
        </div>
        <button class="btn-sovereign">Complete Restoration</button>
      </div>
    </article>

  </div>
</body>
}

    h1, h2, h3 {
      font-family: var(--font-ceremonial);
      color: var(--accent-burnished-brass);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .page-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }

    .crest {
      width: 32px;
      height: 32px;
      stroke: var(--accent-burnished-brass);
      stroke-width: 1.5;
      fill: none;
      margin-right: 0.75rem;
    }

    .gate-card {
      background: var(--bg-gate-slate);
      border: var(--border-sovereign);
      border-radius: 4px;
      box-shadow: var(--shadow-gate);
      display: grid;
      grid-template-columns: 1fr;
      margin: 1.5rem 0;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .gate-card {
        grid-template-columns: 1.1fr 0.9fr;
      }
    }

    .gate-institutional {
      padding: 1.5rem;
      background: linear-gradient(135deg, rgba(28,28,30,1) 0%, rgba(18,18,20,1) 100%);
      border-right: 1px solid rgba(200, 168, 110, 0.15);
    }

    .gate-natural {
      padding: 1.5rem;
      background: radial-gradient(circle at 100% 0%, rgba(200,168,110,0.06) 0%, rgba(28,28,30,0.95) 75%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .gate-title {
      display: flex;
      align-items: center;
      font-family: var(--font-ceremonial);
      color: var(--accent-burnished-brass);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .field-label {
      color: var(--accent-burnished-brass);
      font-size: 0.85rem;
      margin-top: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .field-value {
      font-size: 1rem;
      margin-top: 0.25rem;
    }

    .decree-badge {
      background: var(--accent-brass-subtle);
      padding: 0.35rem 0.75rem;
      border-radius: 4px;
      font-family: var(--font-ceremonial);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    .btn-sovereign {
      background: var(--accent-burnished-brass);
      color: var(--bg-deep-obsidian);
      border: none;
      padding: 0.75rem 1.25rem;
      font-family: var(--font-system);
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 1rem;
    }

    /* Print / Oracle Card Mode */
    @media print {
      body {
        background: white;
        color: black;
      }
      .gate-card {
        page-break-inside: avoid;
        width: 3.5in;
        height: 5in;
        border: 1px solid #C8A86E;
      }
    }
  </style>
</head>
