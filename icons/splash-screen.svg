<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">

  <!-- Obsidian Background -->
  <rect width="1920" height="1080" fill="#0A0A0A"/>

  <!-- Subtle Brass Radial Glow Behind Crest -->
  <radialGradient id="brassGlow" cx="50%" cy="45%" r="40%">
    <stop offset="0%" stop-color="rgba(200,168,110,0.22)"/>
    <stop offset="100%" stop-color="rgba(10,10,10,0)"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#brassGlow)"/>

  <!-- Centered Crest (scaled to 48% of height) -->
  <g transform="translate(960 540) scale(2.1)" stroke="#C8A86E" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- Central Circle -->
    <circle cx="0" cy="0" r="96" stroke-width="8"/>

    <!-- Radiant Rays (every 22.5°) -->
    <g stroke-width="7">
      <line x1="0" y1="-160" x2="0" y2="-104" transform="rotate(22.5)"/>
      <line x1="0" y1="-160" x2="0" y2="-104" transform="rotate(67.5)"/>
      <line x1="0" y1="-160" x2="0" y2="-104" transform="rotate(112.5)"/>
      <line x1="0" y1="-160" x2="0" y2="-104" transform="rotate(157.5)"/>
      <line x1="0" y1="-160" x2="0" y2="-104" transform="rotate(202.5)"/>
      <line x1="0" y1="-160" x2="0" y2="-104" transform="rotate(247.5)"/>
      <line x1="0" y1="-160" x2="0" y2="-104" transform="rotate(292.5)"/>
      <line x1="0" y1="-160" x2="0" y2="-104" transform="rotate(337.5)"/>
    </g>

    <!-- Ray Terminal Dots -->
    <g fill="#C8A86E" stroke="none">
      <circle cx="0" cy="-170" r="4.5" transform="rotate(22.5)"/>
      <circle cx="0" cy="-170" r="4.5" transform="rotate(67.5)"/>
      <circle cx="0" cy="-170" r="4.5" transform="rotate(112.5)"/>
      <circle cx="0" cy="-170" r="4.5" transform="rotate(157.5)"/>
      <circle cx="0" cy="-170" r="4.5" transform="rotate(202.5)"/>
      <circle cx="0" cy="-170" r="4.5" transform="rotate(247.5)"/>
      <circle cx="0" cy="-170" r="4.5" transform="rotate(292.5)"/>
      <circle cx="0" cy="-170" r="4.5" transform="rotate(337.5)"/>
    </g>

    <!-- Diagonal Compass Rays -->
    <g stroke-width="7">
      <line x1="0" y1="-160" x2="0" y2="-82" transform="rotate(45)"/>
      <line x1="0" y1="-160" x2="0" y2="-82" transform="rotate(135)"/>
      <line x1="0" y1="-160" x2="0" y2="-82" transform="rotate(225)"/>
      <line x1="0" y1="-160" x2="0" y2="-82" transform="rotate(315)"/>
    </g>

    <g fill="#C8A86E" stroke="none">
      <circle cx="0" cy="-180" r="5" transform="rotate(45)"/>
      <circle cx="0" cy="-180" r="5" transform="rotate(135)"/>
      <circle cx="0" cy="-180" r="5" transform="rotate(225)"/>
      <circle cx="0" cy="-180" r="5" transform="rotate(315)"/>
    </g>

    <!-- Horizontal Axis -->
    <g stroke-width="8">
      <line x1="-188" y1="0" x2="188" y2="0"/>
      <polyline points="-168,-16 -188,0 -168,16"/>
      <polyline points="168,-16 188,0 168,16"/>
    </g>

    <!-- Vertical Axis -->
    <g stroke-width="8">
      <line x1="0" y1="-188" x2="0" y2="188"/>
      <polyline points="-16,-168 0,-188 16,-168"/>
      <polygon points="0,158 14,178 0,202 -14,178" stroke-width="6"/>
    </g>

  </g>

  <!-- Title Text -->
  <text x="960" y="880" fill="#C8A86E" font-family="Cinzel" font-size="96" text-anchor="middle" letter-spacing="8">
    SOVEREIGN NAVIGATOR
  </text>

  <!-- Subtitle -->
  <text x="960" y="960" fill="#F5F5F2" font-family="Inter" font-size="36" text-anchor="middle" letter-spacing="2">
    Remedy & Re‑Stabilization Matrix
  </text>

</svg>
